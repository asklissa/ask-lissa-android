workflows:
  android-debug:
    name: Android Debug
    max_build_duration: 60
    instance_type: linux_x1
    environment:
      node: 24
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build debug AAB
        script: |
          cd android && ./gradlew bundleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/debug/*.aab
